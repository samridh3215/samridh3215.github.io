<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body class="min-h-screen bg-bg text-text antialiased">
    <div class="flex min-h-screen flex-col">
      {{ partial "header.html" . }}

      <main class="flex-1">
        {{ block "main" . }}{{ end }}
      </main>

      {{ partial "footer.html" . }}
    </div>
    <script src="{{ "js/main.js" | relURL }}" defer></script>
  </body>
</html>
